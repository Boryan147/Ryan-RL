name: Ryan-RL
channels:
  - pytorch
  - conda-forge
  - default
dependencies:
  - python=3.10
  - pip
  - pytorch
  - cpuonly # Change to 'pytorch-cuda=11.8' (or your version) if you are utilizing a local GPU
  - numpy
  - matplotlib
  - swig # Crucial for building Gym/Gymnasium environments like Box2D
  - pip:
    - gymnasium[all] # Installs the standard RL environments (Classic control, Box2D, etc.)
    - tensorboard # Excellent for plotting your reward curves from scratch